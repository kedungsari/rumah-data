<style>
:root{
  --navy-deep:#04081A;
  --navy:#070c22;
  --copper:#c89a7a;
  --copper-light:#f0d9c0;
  --copper-dark:#8a6248;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  background:#010217;
  overflow:hidden;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
}

/* Partikel bintang halus di background */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{
  position:absolute;
  width:2px;height:2px;
  background:var(--copper-light);
  border-radius:50%;
  opacity:0;
  animation:twinkle 3.5s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;}
  50%{opacity:.7;}
}

/* Glow lembut di belakang logo */
.glow{
  position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(200,154,122,.18) 0%, transparent 70%);
  border-radius:50%;
  z-index:0;
  animation:pulseGlow 4s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{transform:scale(1);opacity:.7;}
  50%{transform:scale(1.15);opacity:1;}
}

.wrap{
  position:relative;
  z-index:2;
  text-align:center;
  padding:24px;
  max-width:640px;
  width:100%;
}

.logo-box{
  opacity:0;
  transform:translateY(24px) scale(.92);
  animation:logoReveal 1.1s cubic-bezier(.19,1,.22,1) forwards .15s;
}
.logo-box img{
  width:100%;
  max-width:480px;
  height:auto;
  filter:drop-shadow(0 8px 40px rgba(200,154,122,.25));
}
@keyframes logoReveal{
  to{opacity:1;transform:translateY(0) scale(1);}
}

.tagline{
  margin-top:22px;
  opacity:0;
  animation:fadeUp .9s ease forwards 1.1s;
}
.tagline .greet{
  font-size:15px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--copper);
  opacity:.85;
}
.tagline .place{
  font-size:22px;
  font-weight:800;
  color:var(--copper-light);
  margin-top:6px;
  letter-spacing:.02em;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

.loader-wrap{
  margin-top:38px;
  opacity:0;
  animation:fadeUp .8s ease forwards 1.6s;
}
.loader-txt{
  font-size:12px;
  color:var(--copper);
  opacity:.75;
  letter-spacing:.05em;
  margin-bottom:12px;
}
.loader-bar{
  width:220px;
  height:3px;
  background:rgba(200,154,122,.15);
  border-radius:3px;
  margin:0 auto;
  overflow:hidden;
  position:relative;
}
.loader-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--copper-dark), var(--copper-light));
  border-radius:3px;
  animation:fillBar 3.2s linear forwards 1.7s;
}
@keyframes fillBar{
  to{width:100%;}
}

.btn-lanjut{
  margin-top:26px;
  opacity:0;
  animation:fadeUp .8s ease forwards 1.9s;
}
.btn-lanjut a{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 26px;
  border:1.5px solid rgba(200,154,122,.4);
  border-radius:30px;
  color:var(--copper-light);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  letter-spacing:.03em;
  transition:all .25s ease;
  background:rgba(200,154,122,.06);
}
.btn-lanjut a:hover,.btn-lanjut a:active{
  background:rgba(200,154,122,.16);
  border-color:var(--copper-light);
  transform:translateY(-2px);
}

.footer-note{
  position:fixed;
  bottom:18px;
  left:0;right:0;
  text-align:center;
  font-size:10px;
  color:var(--copper-dark);
  opacity:0;
  letter-spacing:.05em;
  animation:fadeUp .8s ease forwards 2.1s;
  z-index:2;
}

@media (max-width:480px){
  .logo-box img{max-width:320px;}
  .tagline .place{font-size:18px;}
  .glow{width:400px;height:400px;}
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="glow"></div>

<div class="wrap">
  <div class="logo-box">
    <img src="logo.png" alt="Logo Rumah DataKu Kalurahan Kedungsari" width="480" height="206">
  </div>

  <div class="tagline">
    <div class="greet">Selamat Datang di</div>
    <div class="place">Rumah DataKu — Kalurahan Kedungsari</div>
  </div>

  <div class="loader-wrap">
    <div class="loader-txt" id="loaderTxt">Menyiapkan halaman...</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <div class="btn-lanjut">
    <a href="https://script.google.com/macros/s/AKfycbyewGIwgiLyX83IyWWn38vQaGeQG3iqhG5zC-0LsZ-7Uh6fnZjorb34eq1TuOdxDsqT/exec">
      Lanjutkan Sekarang →
    </a>
  </div>
</div>

<div class="footer-note">© <span id="thn"></span> Pemerintah Kalurahan Kedungsari — Rumah DataKu</div>

<script>
// Taburan bintang kecil acak
(function(){
  var wrap = document.getElementById('stars');
  var n = 40;
  for(var i=0;i<n;i++){
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5+Math.random()*3)+'s';
    wrap.appendChild(s);
  }
})();

document.getElementById('thn').textContent = new Date().getFullYear();

// Redirect otomatis setelah animasi selesai
var TUJUAN = 'https://script.google.com/macros/s/AKfycbyewGIwgiLyX83IyWWn38vQaGeQG3iqhG5zC-0LsZ-7Uh6fnZjorb34eq1TuOdxDsqT/exec';
var txt = document.getElementById('loaderTxt');
setTimeout(function(){ txt.textContent = 'Menghubungkan ke server...'; }, 2400);
setTimeout(function(){ window.location.href = TUJUAN; }, 4700);
</script>
</body>
</html>
